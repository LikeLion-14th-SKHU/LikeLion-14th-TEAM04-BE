# 80번은 Let's Encrypt 검증(acme-challenge)과 443으로의 리다이렉트만 담당한다.
server {
    listen 80;
    server_name api.memory-atelier.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.memory-atelier.store;

    ssl_certificate /etc/letsencrypt/live/api.memory-atelier.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.memory-atelier.store/privkey.pem;

    # MinIO에 저장된 파일을 공개로 서빙한다. 경로 프리픽스는 버킷명과 같아야 한다
    # (S3Uploader.public-url이 만드는 URL이 https://도메인/버킷명/키 형태라서) —
    # .env의 S3_BUCKET을 바꾸면 이 location도 같이 바꿔야 한다
    location /memory-atelier/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
    }

    # AI 서버(별도 docker compose 프로젝트, 호스트 8000번에 publish됨)가 만든 콘셉트 이미지·GLB를
    # 그대로 공개 서빙한다. AI 서버 응답의 image_url/model_url이 이 /ai/static/... 경로 그대로라서
    # 프리픽스를 벗기지 않고 그대로 전달해야 한다(뒤에 슬래시 없는 proxy_pass — /memory-atelier/와 동일 패턴).
    # nginx 컨테이너도 app처럼 host.docker.internal이 필요하다(docker-compose.yml의 nginx
    # extra_hosts 참고).
    location /ai/static/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
    }

    # MCM 제품 카탈로그 이미지(큐레이션 카드용) — /ai/static/과 별개의 정적 마운트.
    # 큐레이션 추천 결과의 image_url이 이 경로를 가리킨다(ai_pipeline/main.py 참고).
    location /ai/assets/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
